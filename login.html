<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Lead Ledger</title>
  <style>
    :root { color-scheme: light; --ink: #1f2a24; --muted: #657067; --paper: #f3f1ea; --panel: #fcfbf7; --line: #d8d3c2; --emerald: #2e6f55; --brick: #a23b3b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: var(--paper); color: var(--ink); font: 15px Inter, system-ui, sans-serif; }
    main { width: min(100%, 390px); padding: 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: 0 18px 50px rgba(31, 42, 36, .12); }
    .mark { display: inline-block; margin-bottom: 22px; padding: 3px 8px; border: 1px solid var(--emerald); border-radius: 3px; color: var(--emerald); font: 700 15px Georgia, serif; }
    h1 { margin: 0 0 6px; font: 600 27px Georgia, serif; } p { margin: 0 0 24px; color: var(--muted); }
    label { display: block; margin: 15px 0 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
    input, button { width: 100%; padding: 11px 12px; border-radius: 6px; font: inherit; }
    input { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    input:focus { outline: 2px solid rgba(46, 111, 85, .25); border-color: var(--emerald); }
    button { margin-top: 22px; border: 0; background: var(--emerald); color: #fff; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 20px; margin-top: 14px; color: var(--brick); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="mark">LG</span>
    <h1>Welcome back</h1>
    <p>Sign in to open your Lead Ledger.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">Sign in</button>
      <div id="message" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
        if (!response.ok) throw new Error((await response.json()).error || 'Could not sign in');
        window.location.href = '/lead-ledger.html';
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
  </script>
</body>
</html>
